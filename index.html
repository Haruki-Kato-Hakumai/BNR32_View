<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>NISSAN SKYLINE GT-R BNR32 | Virtual Showroom</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
      /* =========================================
         Base Design / Dark Theme
      ========================================= */
      :root {
        --primary-color: #c30000; /* 日産やGT-Rをイメージした赤 */
        --accent-color: #00d2ff;  /* テック感のある青 */
        --bg-color: #0a0a0a;
        --card-bg: #141414;
        --text-main: #f0f0f0;
        --text-sub: #888;
      }

      body {
        margin: 0;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'Montserrat', sans-serif; /* ベースは読みやすく */
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
      }

      h1, h2, h3, button {
        font-family: 'Rajdhani', sans-serif; /* 見出しはメカニカルに */
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      /* =========================================
         Header
      ========================================= */
      header {
        width: 100%;
        padding: 40px 0;
        text-align: center;
        background: linear-gradient(to bottom, #000 0%, transparent 100%);
      }

      header h1 {
        font-size: 3rem;
        margin: 0;
        font-weight: 700;
        background: linear-gradient(90deg, #fff, #999);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      header p {
        color: var(--primary-color);
        font-weight: bold;
        margin-top: 5px;
        letter-spacing: 0.3em;
        font-size: 0.9rem;
      }

      /* =========================================
         Section: Unity (The Experience)
      ========================================= */
      .section-title {
        font-size: 1.5rem;
        border-left: 4px solid var(--primary-color);
        padding-left: 15px;
        margin: 60px 0 30px;
        width: 90%;
        max-width: 1100px;
        color: #fff;
      }

      #unity-wrapper {
        position: relative;
        width: 100%;
        max-width: 1100px;
        background: #000;
        box-shadow: 0 0 50px rgba(0,0,0,0.8);
        border: 1px solid #333;
      }

      #unity-container {
        width: 100%;
        height: auto;
        position: relative;
      }

      canvas {
        display: block;
        width: 100% !important;
        height: auto !important;
        aspect-ratio: 16 / 9;
      }

      /* Unity操作ガイドオーバーレイ */
      .controls-guide {
        display: flex;
        justify-content: space-between;
        background: #1a1a1a;
        padding: 15px 30px;
        border-top: 1px solid #333;
        font-size: 0.85rem;
        color: var(--text-sub);
      }
      .controls-guide span {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .key-icon {
        border: 1px solid #555;
        border-radius: 4px;
        padding: 2px 8px;
        font-family: monospace;
        color: #fff;
        background: #222;
      }

      /* =========================================
         Section: 2D Configurator
      ========================================= */
      #car-viewer {
        background: var(--card-bg);
        width: 90%;
        max-width: 1100px;
        padding: 40px;
        margin-top: 20px;
        border-radius: 4px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        border: 1px solid #222;
      }

      /* 車の画像周り */
      .viewer-stage {
        position: relative;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 400px;
        /* スポットライトのような背景演出 */
        background: radial-gradient(circle at center, #2a2a2a 0%, #141414 70%);
        border-radius: 4px;
        overflow: hidden;
      }

      #car-image {
        width: 80%;
        max-width: 700px;
        filter: drop-shadow(0 20px 30px rgba(0,0,0,0.6));
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.27);
        z-index: 2;
      }

      /* 左右の矢印ボタンを画像の両サイドに配置 */
      .nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        color: #fff;
        border: 1px solid rgba(255,255,255,0.2);
        width: 50px;
        height: 50px;
        border-radius: 50%;
        font-size: 1.2rem;
        cursor: pointer;
        z-index: 10;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .nav-btn:hover {
        background: rgba(255,255,255,0.1);
        border-color: #fff;
        box-shadow: 0 0 15px rgba(255,255,255,0.3);
      }
      .prev-btn { left: 20px; }
      .next-btn { right: 20px; }

      /* カラーピッカー */
      .color-panel {
        margin-top: 40px;
        display: flex;
        gap: 20px;
        padding: 20px;
        background: #000;
        border-radius: 50px;
        border: 1px solid #333;
      }

      .color-circle {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        cursor: pointer;
        position: relative;
        transition: transform 0.2s;
        box-shadow: inset 0 2px 4px rgba(255,255,255,0.3), 0 5px 10px rgba(0,0,0,0.5);
      }
      .color-circle::after {
        content: '';
        position: absolute;
        top: -4px; left: -4px; right: -4px; bottom: -4px;
        border-radius: 50%;
        border: 2px solid transparent;
        transition: border-color 0.3s;
      }
      .color-circle:hover { transform: scale(1.1); }
      .color-circle:hover::after { border-color: #fff; }

      /* =========================================
         Section: Gallery
      ========================================= */
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        width: 90%;
        max-width: 1100px;
        margin: 0 auto;
      }

      .gallery-item {
        position: relative;
        overflow: hidden;
        border-radius: 4px;
        cursor: pointer;
      }

      .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.5s ease;
        filter: brightness(0.8);
      }

      .gallery-item:hover img {
        transform: scale(1.05);
        filter: brightness(1.1);
      }
      
      /* オーバーレイ効果 */
      .gallery-item::before {
        content: '';
        position: absolute;
        top:0; left:0; width:100%; height:100%;
        background: rgba(0,0,0,0.2);
        z-index: 1;
        transition: 0.3s;
      }
      .gallery-item:hover::before {
        background: rgba(0,0,0,0);
      }

      /* =========================================
         Footer & Modal
      ========================================= */
      footer {
        margin-top: 100px;
        padding: 40px;
        width: 100%;
        text-align: center;
        border-top: 1px solid #222;
        color: #555;
        font-size: 0.8rem;
      }

      /* Modal (共通設定) */
      .modal {
        display: none;
        position: fixed;
        z-index: 9999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.95);
        backdrop-filter: blur(5px);
        justify-content: center;
        align-items: center;
      }
      .modal img {
        max-width: 90%;
        max-height: 90%;
        box-shadow: 0 0 50px rgba(0,0,0,1);
        border: 1px solid #333;
      }
    </style>
  </head>

  <body>

    <header>
      <h1>SKYLINE GT-R <span style="font-weight:300;">BNR32</span></h1>
      <p>LEGENDARY PERFORMANCE</p>
    </header>

    <div class="section-title">
      <h3>INTERACTIVE 3D EXPERIENCE</h3>
    </div>

    <div id="unity-wrapper">
      <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
          <div id="unity-logo"></div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
        </div>
      </div>
      <div class="controls-guide">
        <span><span class="key-icon">←</span> <span class="key-icon">→</span> ROTATE VIEW</span>
        <span><span class="key-icon">1</span> - <span class="key-icon">9</span> CHANGE COLOR</span>
        <button id="unity-fullscreen-button" style="background:none; border:none; color:#888; cursor:pointer;">[ FULLSCREEN ]</button>
      </div>
    </div>


    <div class="section-title">
      <h3>EXTERIOR CONFIGURATOR</h3>
    </div>

    <div id="car-viewer">
      <div class="viewer-stage">
        <button class="nav-btn prev-btn" onclick="prevAngle()">❮</button>
        <img id="car-image" src="images/white_1.png" alt="Nissan Skyline GT-R BNR32">
        <button class="nav-btn next-btn" onclick="nextAngle()">❯</button>
      </div>

      <div class="color-panel">
        <div class="color-circle" style="background:#f0f0f0;" onclick="setColor('white')" title="White"></div>
        <div class="color-circle" style="background:#c0c0c0;" onclick="setColor('silver')" title="Silver"></div>
        <div class="color-circle" style="background:#4b4b4b;" onclick="setColor('gunmetal')" title="Gunmetal Grey"></div>
        <div class="color-circle" style="background:#080808;" onclick="setColor('black')" title="Black Pearl"></div>
        <div class="color-circle" style="background:#a80000;" onclick="setColor('red')" title="Red Pearl"></div>
        <div class="color-circle" style="background:#87ceeb;" onclick="setColor('skyblue')" title="Blue"></div>
        <div class="color-circle" style="background:#003399;" onclick="setColor('blue')" title="Dark Blue"></div>
      </div>
    </div>


    <div class="section-title">
      <h3>GALLERY</h3>
    </div>

    <div class="gallery-grid">
      <div class="gallery-item" onclick="openModal(this)">
        <img src="images/BNR32_black01.jpeg" alt="BNR32 Front View">
      </div>
      <div class="gallery-item" onclick="openModal(this)">
        <img src="images/BNR32_black02.jpeg" alt="BNR32 Rear View">
      </div>
      <div class="gallery-item" onclick="openModal(this)">
        <img src="images/BNR32_silver.jpeg" alt="BNR32 Silver">
      </div>
      <div class="gallery-item" onclick="openModal(this)">
        <img src="images/BNR32_red.jpeg" alt="BNR32 Red">
      </div>
    </div>

    <div id="modal" class="modal" onclick="closeModal()">
      <img id="modal-img">
    </div>

    <footer>
      <p>© 2025 HARUKI KATO — BNR32 VIRTUAL GALLERY</p>
    </footer>


    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/BNR32_View.loader.js";
      var config = {
        dataUrl: buildUrl + "/BNR32_View.data",
        frameworkUrl: buildUrl + "/BNR32_View.framework.js",
        codeUrl: buildUrl + "/BNR32_View.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "BNR32",
        productVersion: "0.1",
      };

      // モバイル対応ロジックはそのまま維持
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      // 読み込み処理
      loadingBar.style.display = "block";
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>

    <script>
      let currentAngle = 1;
      let currentColor = 'white';
      const maxAngle = 9;
      const carImgElement = document.getElementById('car-image');

      function updateImage() {
        // 画像切り替え時に一瞬フェードさせる演出
        carImgElement.style.opacity = 0.7;
        carImgElement.style.transform = "scale(0.98)";
        
        setTimeout(() => {
          carImgElement.src = `images/${currentColor}_${currentAngle}.png`;
          carImgElement.onload = () => {
             carImgElement.style.opacity = 1;
             carImgElement.style.transform = "scale(1)";
          };
        }, 100);
      }

      function nextAngle() {
        currentAngle = currentAngle % maxAngle + 1;
        updateImage();
      }

      function prevAngle() {
        currentAngle = (currentAngle - 2 + maxAngle) % maxAngle + 1;
        updateImage();
      }

      function setColor(color) {
        currentColor = color;
        updateImage();
      }

      // キーボード操作対応 (左右キーで回転)
      document.addEventListener('keydown', (e) => {
        if(e.key === "ArrowRight") nextAngle();
        if(e.key === "ArrowLeft") prevAngle();
      });
    </script>

    <script>
      function openModal(element) {
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');
        const src = element.querySelector('img').src;
        modalImg.src = src;
        modal.style.display = 'flex';
      }

      function closeModal() {
        document.getElementById('modal').style.display = 'none';
      }
    </script>
  </body>
</html>
